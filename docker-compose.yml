services:
  api:
    build: .
    image: ejercicio-docker-audit:local
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      FLASK_DEBUG: "0"
      PORT: "5050"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "5050"

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal

  drizzle:
    image: ghcr.io/drizzle-team/gateway:latest
    restart: unless-stopped
    environment:
      PORT: "4983"
      MASTERPASS: ${DRIZZLE_MASTERPASS}
    volumes:
      - drizzle_data:/app
    networks:
      - internal
    expose:
      - "4983"

  kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data
    networks:
      - internal
    expose:
      - "3001"

  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  drizzle_data:
  kuma_data:
  npm_data:
  npm_letsencrypt: