services:
  api:
    build: .
    image: ejercicio-docker-audit:local
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      FLASK_DEBUG: "0"
      PORT: "5050"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "5050"
    mem_limit: 200m

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=30
      - --innodb-buffer-pool-instances=1
      - --innodb-log-buffer-size=8M
      - --table-open-cache=64
      - --thread-cache-size=8
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - internal
    mem_limit: 400m

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    environment:
      DOZZLE_AUTH_PROVIDER: simple
      DOZZLE_AUTH_USER: ${DOZZLE_AUTH_USER}
      DOZZLE_AUTH_PASSWORD: ${DOZZLE_AUTH_PASSWORD_HASH}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal
    expose:
      - "8080"
    mem_limit: 128m

  kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - kuma_data:/app/data
    networks:
      - internal
    expose:
      - "3001"
    mem_limit: 200m

  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - internal
    mem_limit: 150m

networks:
  internal:
    driver: bridge

volumes:
  db_data:
  kuma_data:
  npm_data:
  npm_letsencrypt: