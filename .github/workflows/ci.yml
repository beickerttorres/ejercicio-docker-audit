name: CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest -v

  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit security scan
        run: bandit -r . -x .venv,.git,docs -s B101 -f json -o bandit_report.json
      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit_report.json

  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ejercicio-docker-audit:ci .
      - name: Trivy filesystem scan (0.74.0)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -w /src \
            aquasec/trivy:0.74.0 fs \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            .
      - name: Trivy image scan (0.74.0)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0 image \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            ejercicio-docker-audit:ci

  deploy:
    needs: [test, bandit, trivy]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/ejercicio-docker-audit
            git checkout ${{ github.ref_name }}
            git pull --ff-only origin ${{ github.ref_name }}
            docker compose pull
            docker compose up -d --build
            docker image prune -f